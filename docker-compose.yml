version: '3.8'

services:
  ai-engine:
    build: ./ai-engine
    container_name: tui-ai-engine
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: tui-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_ENGINE_URL=http://ai-engine:8000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - ai-engine
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tui-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped